<!doctype html><html lang="uk"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter;background:#eef0f3;width:1800px;padding:28px;color:#1c1b19;
background-image:radial-gradient(#cdd2d9 1.2px,transparent 1.2px);background-size:22px 22px}
h1{font-size:28px;font-weight:700;margin-bottom:4px}
.sub{font-size:16px;color:#555;margin-bottom:12px}
.legend{display:flex;gap:18px;font-size:14px;margin-bottom:18px;align-items:center}
.legend i{display:inline-block;width:18px;height:18px;border-radius:3px;margin-right:6px;vertical-align:-4px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cl{background:rgba(255,255,255,.85);border:2px solid #9aa3ae;border-radius:14px;padding:14px}
.cl h2{font-size:18px;font-weight:700;margin-bottom:10px}
.notes{display:flex;flex-wrap:wrap;gap:10px}
.n{width:172px;min-height:112px;padding:10px;font-size:13.2px;line-height:1.33;box-shadow:0 2px 3px rgba(0,0,0,.15);border-radius:2px}
.m{background:#fff3a6}.v{background:#bfe6ff}.r{background:#fad4e0}.na{background:#fff;border:2px dashed #9aa3ae;color:#5f6b66;font-style:italic;box-shadow:none}
.n b{display:block;font-size:11px;opacity:.6;margin-bottom:3px;font-weight:600;font-style:normal}
.cn{margin-top:12px;background:#1f5f4a;color:#fff;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.35}
.cn b{color:#ffd88a}
</style></head><body>
<h1>Аналіз інтерв’ю: облік товарів у малому бізнесі (Тема 2)</h1>
<div class="sub">Цитати й ідеї з інтерв’ю → кластери → висновки. Персона: Оксана (власниця онлайн-магазину).</div>
<div class="legend"><span><i style="background:#fff3a6"></i>С1 — Марта, новачок (ШІ)</span><span><i style="background:#bfe6ff"></i>С2 — Віктор, досвідчений (ШІ)</span><span><i style="background:#fad4e0"></i>Р — Святослав Г., реальний респондент</span></div>
<div class="cols" id="c"></div>
<script>
const C=[
['1. Облік живе в кількох місцях',[
['m','Q2','«Все в нотатках на телефоні, а що закінчилось — я просто пам’ятаю. Ну, намагаюся»'],
['v','Q2','«Основне — в KeyCRM, але по гаражу ще ведемо Excel, бо там свої коди»'],
['v','Q4','«Половина розбіжностей — це “потім внесу”, яке так і не внесли»'],
['r','Q2','«Веду нотатки в телефоні, зберігаю… в “Збереженому” в Telegram, десь у коментарях у Figma»']],
'Немає «джерела правди»: дані в 2–3 місцях, частина — в пам’яті. Продукт має замінити все одразу, а не стати ще одним місцем.'],
['2. Перевірка наявності = піти й подивитися',[
['m','Q3','«Я йду до стелажа, фотографую і надсилаю фото — так навіть краще для клієнта»'],
['v','Q3','«Менеджер набирає мене, я йду в гараж і шукаю коробку. Хвилин п’ять, якщо пощастить»'],
['m','Q7','«Відповідаю клієнтам з телефона, навіть коли їду в маршрутці»'],
['r','Q3','«Пишу: “Уточню ввечері”… а він: “Вибач, уже віддав замовлення іншому”»']],
'Відповідь гальмує недовіра до даних і їх відсутність на телефоні; затримка коштує замовлення (Р-Q3). Залишок має бути доступний з телефона миттєво.'],
['3. Перепродаж між каналами',[
['m','Q4','«На ярмарку продала останню “Ваніль”, а ввечері ще й в Instagram її пообіцяла»'],
['v','Q4','«Rozetka і Prom продали ту саму деталь за 10 хвилин — синхронізація ще не встигла»'],
['v','Q8','«CRM оновлює раз на 15 хвилин, а в сезон це вже пізно»'],
['na','—','Тема не стосується: респондент продає послуги, а не товари']],
'Перепродаж — болюча проблема для обох ШІ-профілів; реальним респондентом не підтверджено — перевірити в Темі 3. Резерв — у момент оформлення.'],
['4. Дозамовлення «на око»',[
['m','Q5','«Коли бачу, що коробка з воском порожня — тоді й замовляю»'],
['v','Q5','«Раз на тиждень дивлюся звіт по продажах, але ходові позиції закінчуються в середу»'],
['r','Q5','«Помічаю, що треба шукати роботу, коли баланс на картці наближається до нуля»']],
'Користувачі реагують на дефіцит, а не попереджають його. Потрібен поріг мінімального залишку й помітне попередження.'],
['5. Страх складності й ціни',[
['m','Q8','«Відкрила одну програму, там “контрагенти”, “номенклатура” — закрила»'],
['m','Q9','«Щоб безкоштовно, поки в мене до сотні товарів»'],
['v','Q8','«Налаштовували KeyCRM тиждень, частину функцій так і не використовуємо»'],
['v','Q9','«Мені важливо імпортувати мої 2500 позицій, а не вбивати руками»'],
['r','Q8','«Jira — якісь “епіки”, “спринти”… закрив через дві хвилини»'],
['r','Q9','«Без… бухгалтерських термінів типу “контрагенти й акти взаємозвірки”»']],
'Бар’єр входу — термінологія й налаштування. Потрібні прості слова, швидкий старт без обов’язкових полів та імпорт з таблиці.'],
['6. Новинки, яких не було у вимогах',[
['m','Q2','«У мене одна свічка — це 6 ароматів і 2 розміри, і всі рахуються окремо»'],
['v','Q4','«Списали брак — а причину ніде не видно, потім сидиш гадаєш»'],
['v','Q6','«Поставка приходить частинами, і я хочу приймати по коробці»'],
['r','Q7','«Постійно доводиться пересилати повідомлення самому собі»']],
'Нові вимоги: варіанти товару, причина коригування, часткове приймання поставки, синхронізація телефона й ноутбука.']];
document.getElementById('c').innerHTML=C.map(([t,ns,c])=>`<div class="cl"><h2>${t}</h2><div class="notes">${ns.map(n=>`<div class="n ${n[0]}"><b>${n[0]=='m'?'С1 Марта':n[0]=='v'?'С2 Віктор':n[0]=='r'?'Р Святослав':'Реальний'} · ${n[1]}</b>${n[2]}</div>`).join('')}</div><div class="cn"><b>Висновок:</b> ${c}</div></div>`).join('');
</script></body></html>
